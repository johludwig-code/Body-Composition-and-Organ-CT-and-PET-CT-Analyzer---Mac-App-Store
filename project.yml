# XcodeGen definition (ADR 0009). `make app` runs `xcodegen generate`; the
# .xcodeproj is generated and not committed.
name: BCOAnalyzer
options:
  bundleIdPrefix: de.ludwig
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Apple Silicon only: current PyTorch builds no longer ship for Intel,
    # and MOOSE uses the Apple GPU through MPS (plan §2 rule 4).
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEAD_CODE_STRIPPING: YES

packages:
  BCOAKit:
    path: Packages/BCOAKit
  BCOAStore:
    path: Packages/BCOAStore
  # The app opens the database itself; same package and version range as in
  # BCOAStore, so SwiftPM resolves it once.
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: "7.0.0"

targets:
  BCOAnalyzer:
    type: application
    platform: macOS
    sources:
      - path: App/Sources/BCOAnalyzer
      - path: App/Resources
        excludes:
          - "*.entitlements"
          - "Info.plist"
    dependencies:
      - package: BCOAKit
      - package: BCOAStore
      - package: GRDB
    settings:
      base:
        PRODUCT_NAME: BCOAnalyzer
        PRODUCT_BUNDLE_IDENTIFIER: de.ludwig.bcoanalyzer
        INFOPLIST_FILE: App/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Resources/BCOAnalyzer.entitlements
        # Sandbox and hardened runtime in every configuration, Debug
        # included, so that a sandbox problem shows up on the first run and
        # not in App Review (ADR 0003).
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_INCOMING_NETWORK_CONNECTIONS: NO
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: NO
        ENABLE_FILE_ACCESS_USER_SELECTED_FILES: readwrite
    postBuildScripts:
      # Copies the backend built by `make runtime` and `make models` into
      # Contents/Resources and signs every Mach-O file in it, inside out,
      # before Xcode signs the app around it. Without a backend (a pure UI
      # build) it does nothing, and Self-Test reports the missing pieces.
      - name: Embed Python backend
        script: "\"${PROJECT_DIR}/Scripts/embed_backend.sh\""
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(PROJECT_DIR)/build/runtime/python/bin/python3
          - $(PROJECT_DIR)/build/models/manifest.json
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/backend.stamp

  BCOAnalyzerUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: App/UITests
    dependencies:
      - target: BCOAnalyzer

schemes:
  BCOAnalyzer:
    build:
      targets:
        BCOAnalyzer: all
    test:
      targets:
        - BCOAnalyzerUITests
        - package: BCOAKit/BCOAKitTests
        - package: BCOAStore/BCOAStoreTests
    archive:
      config: Release
