name: CI

on:
  push:
  pull_request:

jobs:
  worker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # The Makefile holds the one list of test dependencies. A second copy
      # here drifted: CI lacked urllib3 and matplotlib, so two guard tests
      # (ADR 0016) skipped in CI and ran only on a developer's machine.
      - name: Worker and script tests
        run: make test-worker

  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: BCOAKit
        run: cd Packages/BCOAKit && swift test
      - name: BCOAStore
        run: cd Packages/BCOAStore && swift test

  app:
    runs-on: macos-15
    needs: [swift]
    steps:
      - uses: actions/checkout@v4
      - name: Generate and build the UI (no backend, ad hoc signed)
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project BCOAnalyzer.xcodeproj -scheme BCOAnalyzer -configuration Debug \
            -derivedDataPath build CODE_SIGN_IDENTITY=- build
