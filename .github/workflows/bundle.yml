# The whole app with its backend, built and exercised on Apple Silicon:
# runtime → model → licences → app → verify → worker in the sandbox.
#
# This is as much of spikes S1, S2 and S4 as a hosted runner can answer. What
# it cannot: MPS performance on real hardware, a user-chosen folder through a
# security-scoped bookmark, a Developer ID or App Store signature (S3).
name: Bundle

on:
  workflow_dispatch:
    inputs:
      real_case:
        description: "Also segment the CT of one public FDG PET/CT (IDC, ACRIN-NSCLC-FDG-PET) in the sandbox"
        type: boolean
        default: false
      real_models:
        description: "Models for the real case, space-separated (each must be in Models/manifest.lock.json)"
        type: string
        default: "clin_ct_organs"
  pull_request:
    paths:
      - "Scripts/**"
      - "Worker/**"
      - "Models/**"
      - "App/Resources/*.entitlements"
      - "project.yml"
      - "Makefile"
      - ".github/workflows/bundle.yml"

jobs:
  bundle:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # Absolute: a sandboxed process runs with the container as its working
      # directory, so a relative path to the probe resolves inside the
      # container (the second run failed on exactly that).
      APP: ${{ github.workspace }}/build/Build/Products/Release/BCOAnalyzer.app
      # Through the environment, not interpolated into the scripts, so that
      # whatever is typed into the dispatch form stays data.
      REAL_MODELS: ${{ inputs.real_models }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Tools
        run: |
          brew install xcodegen
          sw_vers
          sysctl -n machdep.cpu.brand_string hw.memsize hw.ncpu

      - name: Cache downloads (CPython archive, model archives)
        uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-${{ hashFiles('Scripts/build_runtime.sh', 'Models/manifest.lock.json') }}

      - name: Runtime (pinned CPython, locked packages, ADR 0014 trim)
        run: make runtime

      - name: Models (clin_ct_organs and the real case's, checked against the lock)
        run: make models MODELS="$(echo clin_ct_organs $REAL_MODELS | tr ' ' '\n' | sort -u | xargs)"

      - name: Licences (fails on GPL, LGPL or unknown)
        run: make licenses

      - name: S1 outside the app (bundled Python, phantom, no sandbox)
        run: |
          /usr/bin/time -l Scripts/run_selftest.sh clin_ct_organs | tee build/s1-selftest.jsonl
          tail -1 build/s1-selftest.jsonl | grep -q '"status":"ok"'

      - name: App (Release, ad hoc, backend embedded and signed)
        run: make app CONFIG=Release

      - name: Verify (itms-services, entitlements, signatures, manifest, ADR 0014)
        run: make verify

      - name: Sandboxed probe in the app bundle
        run: |
          # A sandboxed tool started on its own, not by a sandboxed parent,
          # needs its own bundle identifier in an embedded Info.plist section
          # (Apple: "Embedding a command-line tool in a sandboxed app"). The
          # first run, without one, died before printing a single line.
          swiftc -O Scripts/ci/WorkerProbe.swift -o "$APP/Contents/MacOS/bcoa-probe" \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist \
            -Xlinker Scripts/ci/probe-Info.plist
          codesign --force --sign - --options runtime -i de.ludwig.bcoanalyzer.probe \
            --entitlements App/Resources/BCOAnalyzer.entitlements "$APP/Contents/MacOS/bcoa-probe"
          # The probe changed the bundle; seal it again around the signed tree.
          codesign --force --sign - --options runtime \
            --entitlements App/Resources/BCOAnalyzer.entitlements "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      - name: S2 in the sandbox (worker inherits; a folder nobody granted stays closed)
        run: |
          status=0
          "$APP/Contents/MacOS/bcoa-probe" spike_s2 \
            "{\"source_dir\": \"$GITHUB_WORKSPACE/Protocol/fixtures\"}" > build/s2.jsonl || status=$?
          cat build/s2.jsonl
          echo "probe exit status: $status"
          python3 - build/s2.jsonl <<'PY'
          import json, sys
          events = [json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          result = next(e for e in events if e["type"] == "result")["payload"]
          print(json.dumps(result, indent=1))
          assert result["sandboxed"], "worker does not see the sandbox"
          assert result["write_project"]["ok"], "worker cannot write the project"
          # No open panel granted this folder: the sandbox must refuse it.
          assert not result["read_source"]["ok"], "sandbox did not stop an ungranted read"
          assert events[-1]["status"] == "ok"
          PY

      - name: S1 in the sandbox (self-test with inference through the signed tree)
        run: |
          /usr/bin/time -l "$APP/Contents/MacOS/bcoa-probe" selftest \
            '{"inference": true, "inference_model": "clin_ct_organs"}' | tee build/s1-sandbox.jsonl
          python3 - build/s1-sandbox.jsonl <<'PY'
          import json, sys
          events = [json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          result = next(e for e in events if e["type"] == "result")["payload"]
          print(json.dumps(result, indent=1))
          assert result["checksum_mismatches"] == []
          assert result["inference"]["same_grid"]
          assert events[-1]["status"] == "ok"
          PY

      - name: Real case (CT of a public FDG PET/CT, sandboxed worker, on request)
        if: inputs.real_case
        timeout-minutes: 75
        run: Scripts/ci/real_case.sh "$APP" $REAL_MODELS

      - name: Sandbox report (what the worker tried and was refused)
        if: always()
        # Plan §16, "Sandbox and offline": no connection, no write outside the
        # allowed places. The worker has no network entitlement, so an attempt
        # shows up here as a refusal rather than as traffic. S2 writes into the
        # ungranted source folder on purpose; that refusal is expected.
        run: |
          log show --last 3h --style compact --predicate \
            'eventMessage CONTAINS "Sandbox: python3" OR eventMessage CONTAINS "Sandbox: bcoa-probe"' \
            2>/dev/null | grep "Sandbox:" > build/sandbox-denials.txt || true
          echo "refusals, counted by process, operation and path:"
          sed -E 's/^.*Sandbox: //; s/\([0-9]+\)//' build/sandbox-denials.txt \
            | sort | uniq -c | sort -rn | head -80
          # The operation, not any path that merely contains the word.
          if grep -Eq "deny\([0-9]+\) network-" build/sandbox-denials.txt; then
            echo "::error::the sandboxed worker tried to use the network"
            exit 1
          fi

      - name: Worker logs (on failure)
        if: failure()
        # Printed rather than only uploaded: whoever reads a failed run may be
        # able to open the job log but not download artifacts.
        run: |
          for f in build/s1/Study.bcoaproj/logs/*.log \
                   ~/Library/Containers/de.ludwig.bcoanalyzer*/Data/Probe.bcoaproj/logs/*.log; do
            [ -f "$f" ] || continue
            echo "::group::$f"; tail -200 "$f"; echo "::endgroup::"
          done
          tail -50 build/*.jsonl 2>/dev/null || true
          # A process the kernel stops at launch leaves only these behind.
          for f in ~/Library/Logs/DiagnosticReports/*probe* ~/Library/Logs/DiagnosticReports/*python*; do
            [ -f "$f" ] || continue
            echo "::group::$f"; head -80 "$f"; echo "::endgroup::"
          done
          log show --last 10m --style compact --predicate \
            'process == "bcoa-probe" OR process BEGINSWITH "python3" OR sender == "Sandbox" OR subsystem == "com.apple.sandbox" OR (process == "kernel" AND eventMessage CONTAINS[c] "sandbox")' \
            2>/dev/null | tail -100 || true

      - name: Reports
        if: always()
        run: |
          cat build/runtime/size-report.txt || true
          cat build/Build/Products/Release/size-report.txt || true
          du -sh "$APP" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-reports
          path: |
            build/runtime/size-report.txt
            build/Build/Products/Release/size-report.txt
            build/licenses/THIRD_PARTY_NOTICES.md
            build/*.jsonl
            build/sandbox-denials.txt
            build/s1/Study.bcoaproj/logs
